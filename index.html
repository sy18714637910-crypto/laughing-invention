<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F8C8D0">
<title>习惯打卡</title>
<style>
﻿/* ========== 布达佩斯大饭店 · 复古美学 ========== */
:root {
  --rose: #F8C8D0;
  --rose-deep: #E8A0B0;
  --sage: #94C5B4;
  --sage-dark: #7AB5A0;
  --cream: #FAF6F2;
  --gold: #D4B483;
  --gold-light: #E8D5B8;
  --text: #3A3A3A;
  --text-secondary: #888888;
  --card-bg: #FFFFFF;
  --card-shadow: 0 2px 20px rgba(180, 150, 130, 0.10);
  --radius: 22px;
  --radius-sm: 14px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "Georgia", "Noto Serif SC", "STSong", "Songti SC", "SimSun", "PingFang SC", serif;
  background: var(--cream);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  max-width: 420px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

/* ===== 顶部装饰线 ===== */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 420px;
  height: 3px;
  background: linear-gradient(90deg, var(--rose), var(--gold), var(--sage));
  z-index: 200;
}

/* ===== 头部 ===== */
.app-header {
  position: sticky;
  top: 3px;
  background: var(--cream);
  padding: 20px 24px 14px;
  z-index: 10;
  text-align: center;
}
.app-header h1 {
  font-family: "Georgia", "Noto Serif SC", serif;
  font-size: 21px;
  font-weight: 400;
  letter-spacing: 2px;
  color: var(--text);
}
.app-header .date-sub {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 4px;
  letter-spacing: 1px;
  font-style: italic;
}

/* ===== Banner 装饰区 ===== */
.banner {
  margin: 4px 20px 16px;
  height: 90px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, #F8E8EC 0%, #FDE8D0 40%, #E8F0EC 100%);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.banner::before {
  content: '';
  position: absolute;
  width: 100%; height: 100%;
  background:
    /* 简化建筑剪影 */
    radial-gradient(ellipse 60px 30px at 80px 65px, rgba(200,160,140,0.25) 0%, transparent 70%),
    radial-gradient(ellipse 30px 50px at 80px 40px, rgba(200,160,140,0.20) 0%, transparent 70%),
    radial-gradient(ellipse 40px 20px at 200px 70px, rgba(180,200,180,0.25) 0%, transparent 70%),
    radial-gradient(ellipse 25px 35px at 280px 45px, rgba(200,160,140,0.18) 0%, transparent 70%),
    radial-gradient(ellipse 35px 25px at 330px 65px, rgba(180,190,170,0.20) 0%, transparent 70%);
  opacity: 0.8;
}
.banner-text {
  font-family: "Georgia", serif;
  font-size: 14px;
  color: var(--text-secondary);
  letter-spacing: 3px;
  font-style: italic;
  z-index: 1;
  opacity: 0.6;
}

/* ===== 页面容器 ===== */
.page {
  padding: 0 20px 110px;
  animation: fadeIn 0.35s ease;
}
.page.hidden { display: none; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== 底部导航 ===== */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 420px;
  height: 68px;
  background: var(--card-bg);
  display: flex;
  border-top: 1px solid var(--gold-light);
  z-index: 100;
  box-shadow: 0 -2px 16px rgba(180, 150, 130, 0.08);
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: none;
  background: none;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 10px;
  font-family: "Georgia", "Noto Serif SC", serif;
  letter-spacing: 1px;
  transition: all 0.3s;
  gap: 4px;
}
.nav-item .nav-icon { font-size: 18px; }
.nav-item.active { color: var(--rose-deep); }
.nav-item.active::after {
  content: '';
  position: absolute;
  bottom: 8px;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--rose-deep);
}
.nav-item:active { transform: scale(0.95); }

/* ===== 分类标签 ===== */
.category-filter {
  display: flex;
  gap: 10px;
  padding: 4px 0 16px;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
  justify-content: center;
}
.category-filter::-webkit-scrollbar { display: none; }
.filter-tag {
  white-space: nowrap;
  padding: 7px 18px;
  border-radius: 20px;
  background: transparent;
  border: 1px solid var(--gold-light);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.3s;
  color: var(--text-secondary);
  font-family: "Georgia", "Noto Serif SC", serif;
  letter-spacing: 0.5px;
}
.filter-tag.active {
  background: var(--rose);
  color: #fff;
  border-color: var(--rose);
  font-style: italic;
}

/* ===== 习惯卡片 ===== */
.habit-list { display: flex; flex-direction: column; gap: 12px; }
.habit-card {
  display: flex;
  align-items: center;
  padding: 16px 18px;
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--card-shadow);
  transition: all 0.25s;
  position: relative;
}
.habit-card:active { transform: scale(0.985); }
.habit-card::after {
  content: '';
  position: absolute;
  left: 0; top: 12px; bottom: 12px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: var(--cat-color, #D4B483);
}
.habit-info { flex: 1; min-width: 0; }
.habit-name {
  font-size: 14px;
  font-weight: 400;
  margin-bottom: 4px;
  letter-spacing: 0.5px;
}
.habit-meta {
  display: flex;
  gap: 10px;
  align-items: center;
  font-size: 11px;
  font-style: italic;
}
.habit-cat { color: var(--text-secondary); }
.habit-streak {
  color: var(--rose-deep);
  font-weight: 400;
  background: rgba(248,200,208,0.15);
  padding: 2px 8px;
  border-radius: 10px;
}
.habit-reminder { font-size: 11px; }

/* ===== 打卡徽章按钮 ===== */
.check-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 2px solid var(--gold-light);
  background: var(--cream);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  flex-shrink: 0;
  position: relative;
}
.check-btn::before {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 1px dashed transparent;
  transition: all 0.35s;
}
.check-btn:hover::before {
  border-color: var(--gold);
  animation: rotateDash 8s linear infinite;
}
@keyframes rotateDash {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.check-btn .check-icon { font-size: 20px; }
.check-btn.checked {
  background: var(--rose);
  border-color: var(--rose-deep);
  box-shadow: 0 4px 16px rgba(232, 160, 176, 0.3);
}
.check-btn:active { transform: scale(0.85); }

/* ===== 今日摘要 ===== */
.today-summary {
  margin-top: 20px;
  padding: 20px 24px;
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--card-shadow);
  text-align: center;
}
.summary-item { margin-bottom: 12px; }
.summary-num {
  font-size: 32px;
  font-weight: 400;
  color: var(--rose-deep);
  font-family: "Georgia", serif;
  letter-spacing: 1px;
}
.summary-label {
  font-size: 11px;
  color: var(--text-secondary);
  font-style: italic;
  margin-top: 4px;
  letter-spacing: 1px;
}
.progress-bar {
  height: 4px;
  background: var(--gold-light);
  border-radius: 2px;
  overflow: hidden;
  max-width: 200px;
  margin: 0 auto;
}
.progress-fill {
  height: 100%;
  background: var(--rose);
  border-radius: 2px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ===== 区域标题 ===== */
.section { margin-top: 24px; }
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.section-header h3 {
  font-size: 15px;
  font-weight: 400;
  font-family: "Georgia", "Noto Serif SC", serif;
  letter-spacing: 1px;
  color: var(--text);
}
.section-header h4 {
  font-size: 13px;
  font-weight: 400;
  color: var(--text-secondary);
  font-style: italic;
}

/* ===== 计划卡片 ===== */
.plan-card {
  padding: 16px 18px;
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--card-shadow);
  margin-bottom: 12px;
}
.plan-card.active-plan {
  border-left: 3px solid var(--rose);
}
.plan-card.inactive {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.plan-name {
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 0.5px;
}
.plan-desc {
  font-size: 12px;
  color: var(--text-secondary);
  margin: 4px 0;
  font-style: italic;
}
.plan-period { font-size: 11px; color: var(--text-secondary); }
.plan-habits-count {
  font-size: 11px;
  color: var(--rose-deep);
  margin: 6px 0;
  font-style: italic;
}
.plan-actions { display: flex; gap: 8px; margin-top: 10px; }

/* ===== 习惯条目 ===== */
.habit-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: var(--card-bg);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  box-shadow: 0 1px 8px rgba(180, 150, 130, 0.06);
}
.habit-item-info { flex: 1; min-width: 0; }
.habit-item-name { font-size: 13px; letter-spacing: 0.3px; }
.habit-item-actions { display: flex; gap: 4px; }

/* ===== 按钮 ===== */
.btn {
  padding: 9px 18px;
  border-radius: 20px;
  border: none;
  font-size: 12px;
  font-weight: 400;
  cursor: pointer;
  transition: all 0.25s;
  font-family: "Georgia", "Noto Serif SC", serif;
  letter-spacing: 0.5px;
}
.btn:active { transform: scale(0.96); }
.btn-primary {
  background: var(--rose);
  color: #fff;
}
.btn-primary:hover { background: var(--rose-deep); }
.btn-outline {
  background: transparent;
  border: 1px solid var(--gold);
  color: var(--text);
}
.btn-outline:hover {
  background: var(--rose);
  color: #fff;
  border-color: var(--rose);
}
.btn-danger {
  background: #E88888;
  color: #fff;
}
.btn-sm { padding: 6px 14px; font-size: 11px; }
.btn-icon {
  width: 30px; height: 30px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: var(--cream);
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  color: var(--text-secondary);
}
.btn-icon:hover {
  border-color: var(--gold);
  background: var(--card-bg);
}

/* ===== 空状态 ===== */
.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-secondary);
}
.empty-icon { font-size: 42px; margin-bottom: 14px; opacity: 0.7; }
.empty-state p {
  margin-bottom: 6px;
  font-size: 13px;
  font-style: italic;
}
.empty-hint { font-size: 11px; color: #bbb; }
.empty-state .btn { margin-top: 18px; }

/* ===== 名言明信片弹窗 ===== */
.quote-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(60, 40, 30, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s;
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}
.quote-overlay.show {
  opacity: 1;
  pointer-events: auto;
}
.quote-card {
  background: linear-gradient(180deg, #FFFEFC 0%, #FAF6F2 100%);
  padding: 32px 28px 24px;
  border-radius: 16px;
  max-width: 300px;
  width: 85%;
  text-align: center;
  box-shadow: 0 24px 60px rgba(100, 70, 50, 0.18);
  animation: postcardIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  position: relative;
  border: 1.5px solid var(--gold);
}
/* 明信片四角装饰 */
.quote-card::before {
  content: '';
  position: absolute;
  top: 8px; left: 10px;
  width: 14px; height: 14px;
  border-left: 1px solid var(--gold);
  border-top: 1px solid var(--gold);
  opacity: 0.5;
}
.quote-card::after {
  content: '';
  position: absolute;
  bottom: 8px; right: 10px;
  width: 14px; height: 14px;
  border-right: 1px solid var(--gold);
  border-bottom: 1px solid var(--gold);
  opacity: 0.5;
}
/* 角落小花装饰 */
.quote-flower {
  position: absolute;
  font-size: 20px;
  opacity: 0.5;
  pointer-events: none;
}
.quote-flower.tl { top: -4px; left: 4px; }
.quote-flower.br { bottom: -2px; right: 6px; transform: rotate(180deg); }
@keyframes postcardIn {
  from { transform: scale(0.6) translateY(30px); opacity: 0; }
  to { transform: scale(1) translateY(0); opacity: 1; }
}
.quote-icon {
  font-size: 32px;
  margin-bottom: 14px;
  opacity: 0.7;
}
.quote-text {
  font-size: 15px;
  font-weight: 400;
  line-height: 1.8;
  color: #5D3A1A;
  margin-bottom: 16px;
  font-family: "Georgia", "Noto Serif SC", serif;
  letter-spacing: 0.5px;
}
.quote-movie {
  font-size: 11px;
  color: #A08070;
  font-style: italic;
  letter-spacing: 1px;
}
.quote-close {
  position: absolute;
  top: 10px;
  right: 14px;
  border: none;
  background: none;
  font-size: 16px;
  cursor: pointer;
  color: #B09080;
  padding: 4px;
  transition: color 0.2s;
}
.quote-close:hover { color: var(--text); }

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: 84px;
  left: 50%;
  transform: translateX(-50%);
  background: #5D4A3A;
  color: var(--cream);
  padding: 10px 22px;
  border-radius: 20px;
  font-size: 12px;
  z-index: 1001;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  font-family: "Georgia", "Noto Serif SC", serif;
  letter-spacing: 0.5px;
}
.toast.show { opacity: 1; }

/* ===== 模态框 ===== */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(60, 40, 30, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 24px;
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}
.modal-box {
  background: var(--card-bg);
  border-radius: var(--radius);
  width: 100%;
  max-width: 360px;
  max-height: 82vh;
  overflow-y: auto;
  box-shadow: 0 20px 50px rgba(100, 70, 50, 0.15);
  border: 1px solid var(--gold-light);
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 22px 14px;
  border-bottom: 1px solid var(--gold-light);
}
.modal-header h3 {
  font-size: 15px;
  font-weight: 400;
  font-family: "Georgia", "Noto Serif SC", serif;
  letter-spacing: 1px;
}
.modal-close-btn {
  border: none;
  background: none;
  font-size: 16px;
  cursor: pointer;
  color: var(--text-secondary);
  padding: 4px 8px;
  transition: color 0.2s;
}
.modal-close-btn:hover { color: var(--text); }
.modal-body { padding: 18px 22px; }
.modal-body label {
  display: block;
  font-size: 12px;
  font-weight: 400;
  color: var(--text-secondary);
  margin-bottom: 6px;
  margin-top: 14px;
  font-family: "Georgia", "Noto Serif SC", serif;
  letter-spacing: 0.5px;
  font-style: italic;
}
.modal-body label:first-child { margin-top: 0; }
.form-input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--gold-light);
  border-radius: 12px;
  font-size: 13px;
  outline: none;
  transition: border 0.2s;
  background: var(--cream);
  color: var(--text);
  font-family: "Georgia", "Noto Serif SC", serif;
}
.form-input:focus { border-color: var(--rose); }
select.form-input { appearance: none; cursor: pointer; }
.modal-footer {
  display: flex;
  gap: 10px;
  padding: 16px 22px;
  border-top: 1px solid var(--gold-light);
  justify-content: flex-end;
}

/* ===== 统计 ===== */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
.stat-card {
  padding: 20px 16px;
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--card-shadow);
  text-align: center;
}
.stat-num {
  font-size: 28px;
  font-weight: 400;
  color: var(--rose-deep);
  font-family: "Georgia", serif;
}
.stat-label {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 6px;
  font-style: italic;
  letter-spacing: 0.5px;
}

.habit-stat-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.habit-stat-name {
  width: 90px;
  font-size: 12px;
  flex-shrink: 0;
  letter-spacing: 0.3px;
}
.habit-stat-bar-bg {
  flex: 1;
  height: 6px;
  background: var(--gold-light);
  border-radius: 3px;
  overflow: hidden;
}
.habit-stat-bar {
  height: 100%;
  background: var(--rose);
  border-radius: 3px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}
.habit-stat-num {
  font-size: 11px;
  color: var(--text-secondary);
  width: 36px;
  text-align: right;
  font-style: italic;
}

/* ===== 热力图 ===== */
.heatmap { margin: 14px 0; }
.heatmap-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  justify-content: center;
}
.heatmap-cell {
  width: 15px; height: 15px;
  border-radius: 4px;
  cursor: pointer;
  transition: transform 0.15s;
}
.heatmap-cell:hover { transform: scale(1.3); }
.heatmap-cell.level-1 { background: #F0EBE6; }
.heatmap-cell.level-2 { background: #F8D0D8; }
.heatmap-cell.level-3 { background: var(--rose-deep); }
.heatmap-legend {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 10px;
  font-size: 10px;
  color: var(--text-secondary);
  justify-content: center;
  font-style: italic;
}
.heatmap-legend .heatmap-cell { width: 11px; height: 11px; }

/* ===== 设置 ===== */
.setting-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid rgba(212, 180, 131, 0.2);
  font-size: 13px;
  letter-spacing: 0.3px;
}
.setting-info { display: flex; align-items: center; gap: 10px; }
.setting-actions { display: flex; gap: 4px; }

.color-dot {
  width: 18px; height: 18px;
  border-radius: 50%;
  display: inline-block;
  border: 1.5px solid rgba(0,0,0,0.06);
}
.color-picker { display: flex; gap: 10px; flex-wrap: wrap; }
.color-radio { cursor: pointer; }
.color-radio input { display: none; }
.color-radio input:checked + .color-dot {
  outline: 2px solid var(--rose);
  outline-offset: 3px;
}
.color-radio .color-dot {
  width: 30px; height: 30px;
  cursor: pointer;
  transition: all 0.2s;
}
.about-text {
  font-size: 12px;
  color: var(--text-secondary);
  text-align: center;
  padding: 20px 0;
  font-style: italic;
  letter-spacing: 1px;
}

/* ===== 子标题 ===== */
.sub-header { margin-top: 16px; }
/* ===== 时间轴 ===== */
.timeline {
  position: relative;
  padding-left: 0;
}
.time-block {
  position: relative;
  margin-bottom: 8px;
  padding-left: 24px;
}
.time-block::before {
  content: '';
  position: absolute;
  left: 8px;

<script>
﻿// ========== 数据层 - IndexedDB ==========
const DB_NAME = 'HabitTrackerDB';
const DB_VERSION = 2;

let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('categories')) {
        const catStore = db.createObjectStore('categories', { keyPath: 'id', autoIncrement: true });
        catStore.createIndex('sortOrder', 'sortOrder');
      }
      if (!db.objectStoreNames.contains('plans')) {
        const planStore = db.createObjectStore('plans', { keyPath: 'id', autoIncrement: true });
        planStore.createIndex('active', 'active');
      }
      if (!db.objectStoreNames.contains('habits')) {
        const habitStore = db.createObjectStore('habits', { keyPath: 'id', autoIncrement: true });
        habitStore.createIndex('categoryId', 'categoryId');
        habitStore.createIndex('planId', 'planId');
        habitStore.createIndex('archived', 'archived');
      }
      if (!db.objectStoreNames.contains('checkins')) {
        const checkinStore = db.createObjectStore('checkins', { keyPath: 'id', autoIncrement: true });
        checkinStore.createIndex('habitDate', ['habitId', 'date'], { unique: true });
      }
      if (!db.objectStoreNames.contains('quotes')) {
        if (!db.objectStoreNames.contains('reflections')) { db.createObjectStore('reflections', { keyPath: 'id', autoIncrement: true }); }
      if (!db.objectStoreNames.contains('quotes')) { db.createObjectStore('quotes', { keyPath: 'id', autoIncrement: true }); }
      }
    };
    request.onsuccess = (e) => { db = e.target.result; resolve(db); };
    request.onerror = (e) => reject(e.target.error);
  });
}

function tx(storeName, mode = 'readonly') {
  return db.transaction(storeName, mode).objectStore(storeName);
}

function promisify(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

// ===== 分类 CRUD =====
async function getCategories() {
  const items = await promisify(tx('categories').getAll());
  const idx = tx('categories').index('sortOrder');
  const sorted = await promisify(idx.getAll());
  return sorted.length ? sorted : items;
}

async function addCategory(cat) {
  cat.sortOrder = Date.now();
  return promisify(tx('categories', 'readwrite').add(cat));
}

async function updateCategory(id, data) {
  return promisify(tx('categories', 'readwrite').put({ ...data, id }));
}

async function deleteCategory(id) {
  return promisify(tx('categories', 'readwrite').delete(id));
}

// ===== 习惯 CRUD =====
async function getHabits(filter = {}) {
  const all = await promisify(tx('habits').getAll());
  let result = all.filter(h => !h.archived);
  if (filter.categoryId) result = result.filter(h => h.categoryId === filter.categoryId);
  if (filter.planId) result = result.filter(h => h.planId === filter.planId);
  return result.sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
}

async function getHabitById(id) {
  return promisify(tx('habits').get(id));
}

async function addHabit(habit) {
  habit.archived = false;
  habit.createdAt = new Date().toISOString();
  habit.sortOrder = Date.now();
  return promisify(tx('habits', 'readwrite').add(habit));
}

async function updateHabit(id, data) {
  return promisify(tx('habits', 'readwrite').put({ ...data, id }));
}

async function deleteHabit(id) {
  return promisify(tx('habits', 'readwrite').delete(id));
}

async function archiveHabit(id) {
  const habit = await getHabitById(id);
  habit.archived = true;
  return updateHabit(id, habit);
}

// ===== 打卡 CRUD =====

async function incrementCheckin(habitId, dateStr) {
  const store = tx('checkins', 'readwrite');
  const idx = store.index('habitDate');
  const existing = await promisify(idx.get([habitId, dateStr]));
  if (existing) {
    existing.count = (existing.count || 1) + 1;
    return promisify(store.put(existing));
  }
  return promisify(store.add({ habitId, date: dateStr, completed: false, count: 1, timestamp: new Date().toISOString() }));
}

async function completeCheckin(habitId, dateStr) {
  const store = tx('checkins', 'readwrite');
  const idx = store.index('habitDate');
  const existing = await promisify(idx.get([habitId, dateStr]));
  if (existing) {
    existing.completed = true;
    existing.count = existing.count || 1;
    return promisify(store.put(existing));
  }
  return promisify(store.add({ habitId, date: dateStr, completed: true, count: 1, timestamp: new Date().toISOString() }));
}

async function getCheckinCount(habitId, dateStr) {
  const all = await promisify(tx('checkins').getAll());
  const found = all.find(c => c.habitId === habitId && c.date === dateStr);
  return found ? (found.count || 0) : 0;
}

async function checkin(habitId, dateStr) {
  const store = tx('checkins', 'readwrite');
  const idx = store.index('habitDate');
  const existing = await promisify(idx.get([habitId, dateStr]));
  if (existing) {
    existing.completed = !existing.completed;
    return promisify(store.put(existing));
  }
  return promisify(store.add({ habitId, date: dateStr, completed: true, timestamp: new Date().toISOString() }));
}

async function getCheckinsForDate(dateStr) {
  const all = await promisify(tx('checkins').getAll());
  return all.filter(c => c.date === dateStr);
}

async function getCheckinsForHabit(habitId, fromDate, toDate) {
  const all = await promisify(tx('checkins').getAll());
  return all.filter(c => c.habitId === habitId && c.date >= fromDate && c.date <= toDate && c.completed);
}

async function getAllCheckins(fromDate, toDate) {
  const all = await promisify(tx('checkins').getAll());
  return all.filter(c => c.date >= fromDate && c.date <= toDate && c.completed);
}

// ===== 计划 CRUD =====
async function getPlans() {
  return promisify(tx('plans').getAll());
}

async function getActivePlan() {
  const all = await promisify(tx('plans').getAll());
  return all.find(p => p.active) || null;
}

async function addPlan(plan) {
  plan.active = true;
  plan.createdAt = new Date().toISOString();
  return promisify(tx('plans', 'readwrite').add(plan));
}

async function updatePlan(id, data) {
  return promisify(tx('plans', 'readwrite').put({ ...data, id }));
}

async function deletePlan(id) {
  return promisify(tx('plans', 'readwrite').delete(id));
}

async function setActivePlan(id) {
  const all = await promisify(tx('plans', 'readwrite').getAll());
  for (const p of all) {
    p.active = (p.id === id);
    await promisify(tx('plans', 'readwrite').put(p));
  }
}

// ===== 名言 =====
async function getRandomQuote() {
  const all = await promisify(tx('quotes').getAll());
  if (all.length === 0) return null;
  return all[Math.floor(Math.random() * all.length)];
}

async function seedQuotes(quotes) {
  const store = tx('quotes', 'readwrite');
  for (const q of quotes) {
    store.add(q);
  }
  return promisify(store.transaction);
}

</script>

<script>
﻿// ===== 习惯打卡 - 完整版 =====
let currentPage='today';

document.addEventListener('DOMContentLoaded',async()=>{
 try{await openDB();await initData();setupNav();await renderToday();}
 catch(e){document.getElementById('today-content').innerHTML='<div style="padding:20px;color:#c00">加载失败: '+e.message+'<br>请到设置页清除数据后刷新</div>';}
});

function setupNav(){
 document.querySelectorAll('.nav-item').forEach(item=>{
  item.addEventListener('click',()=>navigateTo(item.dataset.page));
 });
}

async function navigateTo(page){
 currentPage=page;
 document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
 var el=document.querySelector('.nav-item[data-page="'+page+'"]');
 if(el)el.classList.add('active');
 document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
 var pg=document.getElementById('page-'+page);
 if(pg)pg.classList.remove('hidden');
 if(page==='today')await renderToday();
 else if(page==='stats')await renderStats();
 else if(page==='settings')await renderSettings();
}

function todayStr(){
 var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

// ===== 总连续天数 =====
async function calcTotalStreak(){
 var streak=0,d=new Date();d.setDate(d.getDate()-1);
 while(true){
  var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  var all=await getCheckinsForDate(ds);
  if(all.filter(function(c){return c.completed;}).length>0){streak++;d.setDate(d.getDate()-1);}else break;
 }
 var today=await getCheckinsForDate(todayStr());
 if(today.filter(function(c){return c.completed;}).length>0)streak++;
 return streak;
}

// ===== 打卡 =====
async function doCheckin(habitId,dateStr,btnEl,isCounter,targetCount){
 if(isCounter){
  var cnt=await getCheckinCount(habitId,dateStr);
  // If already full, reset for today
  if(cnt>=targetCount){
   // Reset: clear today's checkin for this habit
   var store=tx('checkins','readwrite');
   var idx=store.index('habitDate');
   var existing=await promisify(idx.get([habitId,dateStr]));
   if(existing){existing.count=0;existing.completed=false;await promisify(store.put(existing));}
   await renderToday();
   return;
  }
  await incrementCheckin(habitId,dateStr);cnt++;
  if(cnt>=targetCount){
   await completeCheckin(habitId,dateStr);
   await checkAchievements(dateStr);
   await showQuoteModal();
   if(await allDone())setTimeout(function(){showReflectionModal();},4500);
  }
 }else{
  await checkin(habitId,dateStr);
  var cks=await getCheckinsForDate(dateStr);
  var hc=cks.find(function(c){return c.habitId===habitId;});
  if(hc&&hc.completed){
   await checkAchievements(dateStr);
   await showQuoteModal();
   if(await allDone())setTimeout(function(){showReflectionModal();},4500);
  }
 }
 await renderToday();
}

}

async function allDone(){
 var habits=await getHabits();
 if(habits.length===0)return false;

  var c=cks.find(function(ck){return ck.habitId===habits[i].id;});
  if(!c||!c.completed)return false;
 }
 return true;
}

 }

 try{data.reflections=await promisify(tx('reflections').getAll());}catch(e){data.reflections=[];}
 try{data.quotes=await promisify(tx('quotes').getAll());}catch(e){data.quotes=[];}
 var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='habit-backup-'+todayStr()+'.json';a.click();URL.revokeObjectURL(url);showToast('已导出');
}

async function importData(event){
 var file=event.target.files[0];if(!file)return;
 if(!confirm('导入将覆盖现有数据！'))return;
 var text=await file.text();var data=JSON.parse(text);
 var stores=['categories','habits','checkins','reflections','quotes'];
 for(var i=0;i<stores.length;i++){
  try{var store=tx(stores[i],'readwrite');await promisify(store.clear());if(data[stores[i]]){for(var j=0;j<data[stores[i]].length;j++)store.add(data[stores[i]][j]);}}catch(e){}
 }
 showToast('已导入');await renderSettings();await renderToday();
}

async function clearAllData(){
 if(!confirm('确定清除所有数据？不可恢复！'))return;
 var stores=['categories','habits','checkins','reflections','quotes'];
 for(var i=0;i<stores.length;i++){try{await promisify(tx(stores[i],'readwrite').clear());}catch(e){}}
 await initData();showToast('已重置');await renderSettings();await renderToday();
}
</script>
